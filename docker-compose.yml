# Entorno local: MongoDB + app
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: tienda
      ADMIN_TOKEN: cambia-este-token
      BACKUP_DIR: /tmp/backups
    depends_on:
      - mongo

volumes:
  mongo-data:
